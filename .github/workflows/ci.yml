name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Contract is up to date
        run: python -m scripts.gen_contract --check
      - name: Backend unit and real API integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Contract operation and role smoke matrix
        run: python -m scripts.smoke
  front:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: front } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r ../backend/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Real browser acceptance suite on isolated synthetic seeds
        working-directory: backend
        run: python -m scripts.e2e
